<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Space Rescue</title>
		<style>
			body {
				align-items: center;
				background: #111;
				color: #fff;
				display: flex;
				flex-direction: column;
				font-family: sans-serif;
				justify-content: center;
				margin: 0;
				min-height: 100vh;
				overscroll-behavior: none;
			}

			pyxel-run {
				max-width: 100vw;
			}

			.virtual-pad {
				display: flex;
				gap: 24px;
				margin-top: 20px;
			}

			.virtual-pad button {
				background: #333;
				border: 2px solid #fff;
				border-radius: 8px;
				color: #fff;
				font-size: 28px;
				height: 64px;
				touch-action: none;
				width: 96px;
			}

			.virtual-pad button:active {
				background: #666;
			}
		</style>
	</head>
	<body>
		<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>
		<pyxel-run root="." name="main.py"></pyxel-run>
		<div class="virtual-pad" aria-label="バーチャルパッド">
			<button type="button" data-key="ArrowLeft" aria-label="左へ">&#9664;</button>
			<button type="button" data-key="ArrowRight" aria-label="右へ">&#9654;</button>
		</div>
		<script>
			for (const button of document.querySelectorAll("[data-key]")) {
				const key = button.dataset.key;

				const sendKey = (type) => {
					document.dispatchEvent(new KeyboardEvent(type, {
						bubbles: true,
						key,
						code: key,
					}));
				};

				button.addEventListener("pointerdown", (event) => {
					event.preventDefault();
					button.setPointerCapture(event.pointerId);
					sendKey("keydown");
				});
				button.addEventListener("pointerup", () => sendKey("keyup"));
				button.addEventListener("pointercancel", () => sendKey("keyup"));
			}
		</script>
	</body>
</html>
